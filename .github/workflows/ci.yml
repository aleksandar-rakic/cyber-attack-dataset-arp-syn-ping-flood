name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check src

      - name: Baseline on the 25k sample
        run: python src/baseline.py --data data/sample_25k.csv --out sample_results.json

      - name: Notebook is valid JSON with no stored outputs
        run: |
          python - <<'PY'
          import json
          nb = json.load(open("notebooks/eda_baseline_v3.ipynb"))
          outputs = sum(len(c.get("outputs", [])) for c in nb["cells"])
          assert outputs == 0, f"notebook has {outputs} stored outputs"
          print(len(nb["cells"]), "cells")
          PY
