name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check src

      - name: Baseline on the 25k sample
        run: python src/baseline.py --data data/sample_25k.csv --out sample_results.json

      - name: Notebooks are valid JSON with no stored outputs
        run: |
          python - <<'PY'
          import glob
          import json
          paths = sorted(glob.glob("notebooks/*.ipynb"))
          assert paths, "no notebooks found"
          for path in paths:
              nb = json.load(open(path))
              outputs = sum(len(c.get("outputs", [])) for c in nb["cells"])
              assert outputs == 0, f"{path} has {outputs} stored outputs"
              print(path, len(nb["cells"]), "cells")
          PY
